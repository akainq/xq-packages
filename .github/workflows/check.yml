# A pull request that adds or changes packages: can they be in the registry? The summary of the run says what is
# wrong, if anything.
name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The index as it is
        run: |
          if git fetch --depth 1 origin index; then
            git worktree add --detach index FETCH_HEAD
          else
            mkdir index
          fi

      - name: Check the packages
        run: python3 tools/build.py --check --index index --site out/site --cache .cache

      - name: Test the tools
        run: python3 tools/test_build.py
